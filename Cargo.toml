[package]
name = "bot"
version = "0.1.0"
edition = "2024"

[dependencies]
teloxide = { version = "0.12", features = ["macros"] }
dotenv = "0.15"
env_logger = "0.11"
log = "0.4"
governor = { version = "0.10", features = ["std"] }
nonzero_ext = "0.3.0"
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio", "macros"] }
chrono = "0.4"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0.98"
env = "1.0.1"
quanta = "0.12.5"
